[project]
name = "paris-bike-forecast"
version = "0.1.0"
description = "Hourly forecasts for Paris bike counters with rolling backtests, quantile models and drift monitoring"
readme = "README.md"
authors = [
    { name = "Karthik Reddy Changal", email = "83645138+kikugo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "great-expectations>=1.24.1",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
