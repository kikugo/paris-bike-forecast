[project]
name = "paris-bike-forecast"
version = "0.1.0"
description = "Hourly forecasts for Paris bike counters with rolling backtests, quantile models and drift monitoring"
readme = "README.md"
authors = [
    { name = "Karthik Reddy Changal", email = "83645138+kikugo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "great-expectations>=1.24.1",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow-skinny==3.17.2",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
    "statsforecast>=2.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
